name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # only-new-issues reads the PR diff

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CGO_ENABLED: 1 # required by -race

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Verify go.mod/go.sum are tidy
        run: go mod tidy -diff

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0 # keep in sync with Makefile
          only-new-issues: true

      - name: Unit tests
        run: |
          go test ./... -race -shuffle=on -coverprofile=cover.out -covermode=atomic -count=1
          go tool cover -func=cover.out | tail -n 1

      - name: Build
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ github.sha }}
          path: |
            bin/
            cover.out
          if-no-files-found: error
